.like-burst{position:absolute;z-index:6;left:50%;top:285px;transform:translate(-50%,-50%) scale(.5);color:#fff;font-size:112px;line-height:1;opacity:0;pointer-events:none;text-shadow:0 4px 24px rgba(0,0,0,.38)}
.like-burst.show{animation:like-pop .72s ease-out}
@keyframes like-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}24%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}62%{opacity:1;transform:translate(-50%,-50%) scale(.96)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.18)}}
@media (max-width:639px){body{overflow:auto}.app{margin:0;transform-origin:top left}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="shell" id="library">
    <div class="tabs">
      <button class="tab" data-view="tracks">Tracks</button><button class="tab" data-view="albums">Albums</button><button class="tab" data-view="artists">Artists</button><button class="tab" data-view="playlists">Playlists</button><button class="tab" data-view="genres">Genres</button><button class="tab hidden" data-view="settings">Settings</button>
    </div>
    <div class="content" id="content"></div>
    <div class="mini-player" id="mini">
      <button type="button" class="mini-main" id="miniOpen" aria-label="Open player"><img id="miniCover" alt=""><span><span class="mini-title" id="miniTitle">Loading library…</span><span class="mini-sub" id="miniArtist">Library</span></span></button>
      <button type="button" class="mini-toggle" id="miniToggle" aria-label="Play">▶</button>
      <div class="mini-progress"><span id="miniProgress"></span></div>
    </div>
  </div>
  <div class="detail-page hidden" id="detailPage"><div id="detailContent"></div></div>
  <div class="player hidden" id="player">
    <img class="hero playing" id="hero" alt="Album cover">
    <div class="like-burst" id="likeBurst" aria-live="polite">♥</div>
    <div class="player-body" id="playerBody">
      <div class="track-title" id="playerTitle"></div><div class="track-meta" id="playerMeta"></div><div class="quality" id="playerQuality"></div>
      <div class="wavebox"><div class="wave" id="wave"></div><div class="time"><span id="elapsedTime">0:00</span><span id="durationTime">0:00</span></div></div>
      <div class="controls"><button type="button" class="queue-wrap" id="queueBtn"><span class="queue-icon">☰</span><span class="queue-label" id="queueLabel">Queue is empty</span></button></div>
    </div>
  </div>
  <audio id="audio"></audio>
</div>
<script>
const content=document.getElementById('content'),libraryView=document.getElementById('library'),player=document.getElementById('player'),detailPage=document.getElementById('detailPage'),detailContent=document.getElementById('detailContent'),hero=document.getElementById('hero'),body=document.getElementById('playerBody'),audio=document.getElementById('audio');
let library={albums:[],tracks:[],source:''},currentTrack=null,currentView='albums',detailMode='',queue=[],queueIndex=-1,lastSwipeAt=0,tapTimer=0,lastPlayerTap=0;
const likedSongs=new Set();
const TAB_ORDER=['tracks','albums','artists','playlists','genres','settings'],DEFAULT_TABS=['tracks','albums','artists','playlists','genres'],TAB_LABELS={tracks:'Tracks',albums:'Albums',artists:'Artists',playlists:'Playlists',genres:'Genres',settings:'Settings'};
let visibleViews=(()=>{try{const stored=JSON.parse(localStorage.getItem('visibleLibraryTabs'));const valid=Array.isArray(stored)?stored.filter((view,index)=>TAB_ORDER.includes(view)&&stored.indexOf(view)===index).slice(0,6):[];return valid.length?valid:[...DEFAULT_TABS]}catch{return[...DEFAULT_TABS]}})(),settingsReturnView='albums';
let importSummary='',lastFmUser=(()=>{try{return localStorage.getItem('lastFmUser')||''}catch{return''}})();
const searchState={tracks:'',albums:'',artists:'',playlists:'',genres:''},filterState={tracks:'all',albums:'all',artists:'all',playlists:'all',genres:'all'};
const escapeHtml=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const qualityLabel=value=>String(value).replace('B-',' bits / ').replace('kHz',' kHz');
const getArtists=()=>{const map=new Map();library.albums.forEach((album,index)=>{if(!map.has(album.artist))map.set(album.artist,{name:album.artist,cover:album.cover,albums:[],tracks:0});const artist=map.get(album.artist);artist.albums.push({...album,index});artist.tracks+=album.tracks.length});return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))};
const getGenres=()=>{const map=new Map();library.albums.forEach((album,index)=>{const name=album.genre||'Unknown Genre';if(!map.has(name))map.set(name,{name,cover:album.cover,albums:[],tracks:0});const genre=map.get(name);genre.albums.push({...album,index});genre.tracks+=album.tracks.length});return[...map.values()].sort((a,b)=>a.name.localeCompare(b.name))};
function applyTabSettings(){const tabs=document.querySelector('.tabs');visibleViews.forEach(view=>{const tab=tabs.querySelector(`[data-view="${view}"]`);if(tab)tabs.appendChild(tab)});document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('hidden',!visibleViews.includes(tab.dataset.view)));tabs.style.gridTemplateColumns=`repeat(${visibleViews.length},1fr)`}
function filterOptions(view){if(view==='albums')return[['all','All albums'],['az','Title A–Z'],['za','Title Z–A'],['newest','Newest first'],['oldest','Oldest first']];if(view==='artists')return[['all','All artists'],['az','Name A–Z'],['za','Name Z–A'],['most','Most albums']];if(view==='genres')return[['all','All genres'],['az','Name A–Z'],['za','Name Z–A'],['most','Most albums']];if(view==='tracks')return[['all','All tracks'],['az','Title A–Z'],['za','Title Z–A'],['artist','By artist'],['liked','Liked songs']];return[['all','All playlists'],['az','Name A–Z'],['za','Name Z–A']]}
function render(view){currentView=view;content.classList.remove('tools-visible');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view));const label=view[0].toUpperCase()+view.slice(1);content.innerHTML=`<div class="library-tools"><input class="library-search" id="librarySearch" type="search" value="${escapeHtml(searchState[view])}" placeholder="Search ${view}" aria-label="Search ${view}"><select class="library-filter" id="libraryFilter" aria-label="Filter and sort ${view}">${filterOptions(view).map(([value,text])=>`<option value="${value}"${filterState[view]===value?' selected':''}>${text}</option>`).join('')}</select></div><div id="libraryResults" aria-label="${label} results"></div>`;updateResults()}
function updateResults(){const results=document.getElementById('libraryResults');if(!results)return;const query=searchState[currentView].trim().toLocaleLowerCase(),mode=filterState[currentView];let html='',shown=0,total=0;
 if(currentView==='albums'){let items=library.albums.map((item,index)=>({...item,index}));total=items.length;items=items.filter(item=>`${item.title} ${item.artist} ${item.year}`.toLocaleLowerCase().includes(query));if(mode==='az')items.sort((a,b)=>a.title.localeCompare(b.title));if(mode==='za')items.sort((a,b)=>b.title.localeCompare(a.title));if(mode==='newest')items.sort((a,b)=>Number(b.year)-Number(a.year));if(mode==='oldest')items.sort((a,b)=>Number(a.year)-Number(b.year));shown=items.length;html='<div class="grid">'+items.map(a=>`<button type="button" class="album-card" data-album="${a.index}"><div class="cover-wrap"><img src="${a.cover}" alt=""></div><h3>${escapeHtml(a.title)}</h3><p>${escapeHtml(a.artist)} · ${a.year}</p></button>`).join('')+'</div>'}
 else if(currentView==='artists'){const all=getArtists();let items=all.map((item,index)=>({...item,index}));total=items.length;items=items.filter(item=>item.name.toLocaleLowerCase().includes(query));if(mode==='az')items.sort((a,b)=>a.name.localeCompare(b.name));if(mode==='za')items.sort((a,b)=>b.name.localeCompare(a.name));if(mode==='most')items.sort((a,b)=>b.albums.length-a.albums.length||a.name.localeCompare(b.name));shown=items.length;html='<div class="list">'+items.map(a=>`<button type="button" class="row artist-row" data-artist="${a.index}"><img src="${a.cover}" alt=""><div><div class="name">${escapeHtml(a.name)}</div><div class="meta">${a.albums.length} album${a.albums.length===1?'':'s'} · ${a.tracks} tracks</div></div></button>`).join('')+'</div>'}
 else if(currentView==='genres'){const all=getGenres();let items=all.map((item,index)=>({...item,index}));total=items.length;items=items.filter(item=>item.name.toLocaleLowerCase().includes(query));if(mode==='az')items.sort((a,b)=>a.name.localeCompare(b.name));if(mode==='za')items.sort((a,b)=>b.name.localeCompare(a.name));if(mode==='most')items.sort((a,b)=>b.albums.length-a.albums.length||a.name.localeCompare(b.name));shown=items.length;html='<div class="list">'+items.map(g=>`<button type="button" class="row genre-row" data-genre="${g.index}"><img src="${g.cover}" alt=""><div><div class="name">${escapeHtml(g.name)}</div><div class="meta">${g.albums.length} album${g.albums.length===1?'':'s'} · ${g.tracks} tracks</div></div></button>`).join('')+'</div>'}
 else if(currentView==='tracks'){let items=library.tracks.map((item,index)=>({...item,index}));total=items.length;items=items.filter(item=>`${item.title} ${item.artist} ${item.album}`.toLocaleLowerCase().includes(query));if(mode==='liked')items=items.filter(item=>likedSongs.has(item.id));if(mode==='az')items.sort((a,b)=>a.title.localeCompare(b.title));if(mode==='za')items.sort((a,b)=>b.title.localeCompare(a.title));if(mode==='artist')items.sort((a,b)=>a.artist.localeCompare(b.artist)||a.title.localeCompare(b.title));shown=items.length;html='<div class="list">'+items.map(a=>`<button type="button" class="row" data-track="${a.index}"><img src="${a.cover}" alt=""><div><div class="name">${escapeHtml(a.title)}</div><div class="meta">${escapeHtml(a.artist)} · ${escapeHtml(a.album)}</div></div></button>`).join('')+'</div>'}
 else{total=0;shown=0;html='<div class="empty">No local playlists.</div>'}
 results.innerHTML=(shown?html:`<div class="results-empty">${query?'No matching results.':currentView==='playlists'?'No local playlists.':'No items in this filter.'}</div>`)+`<div class="source">${shown} of ${total} ${currentView}</div>`}
function hideAll(){libraryView.classList.add('hidden');player.classList.add('hidden');detailPage.classList.add('hidden')}
function showLibrary(){hideAll();detailMode='';libraryView.classList.remove('hidden')}
function showDetail(html,mode){hideAll();detailMode=mode;detailContent.innerHTML=html;detailPage.classList.toggle('settings-with-tabs',mode==='settings');if(mode==='settings')libraryView.classList.remove('hidden');detailPage.classList.remove('hidden');const scroller=detailContent.querySelector('.detail-scroll');if(scroller)scroller.scrollTop=0}
function trackGlobalIndex(track){return library.tracks.indexOf(track)}
function showAlbum(index){const album=library.albums[index];if(!album)return;showDetail(`<div class="detail-scroll"><div class="detail-head album-head"><img class="detail-cover" src="${album.cover}" alt=""><div><div class="detail-quality">${escapeHtml(qualityLabel(album.quality))}</div><div class="detail-title">${escapeHtml(album.title)}</div><button type="button" class="detail-artist-link" data-open-artist="${getArtists().findIndex(a=>a.name===album.artist)}">${escapeHtml(album.artist)}</button><div class="detail-info">${album.year} · ${album.tracks.length} track${album.tracks.length===1?'':'s'}</div></div></div><div class="detail-actions"><button type="button" class="detail-action primary" data-play-album="${index}" aria-label="Play album">▶</button><button type="button" class="detail-action" data-shuffle-album="${index}" aria-label="Shuffle album">⇄</button></div><div class="detail-tracks">${album.tracks.map(track=>`<button type="button" class="detail-track" data-detail-track="${trackGlobalIndex(track)}"><span class="detail-track-number">${track.number}</span><span><span class="detail-track-title">${escapeHtml(track.title)}</span><span class="detail-track-meta">${escapeHtml(track.artist)}</span></span><span class="${currentTrack===track?'playing-mark':''}">${currentTrack===track?'▥':''}</span></button>`).join('')}</div></div>`,'album') }
function showArtist(index){const artist=getArtists()[index];if(!artist)return;showDetail(`<div class="detail-scroll"><div class="artist-head"><img class="artist-photo" src="${artist.cover}" alt=""><div class="artist-name">${escapeHtml(artist.name)}</div><div class="artist-stats">${artist.albums.length} album${artist.albums.length===1?'':'s'} · ${artist.tracks} tracks</div><div class="artist-bio">Music in your local collection by ${escapeHtml(artist.name)}.</div></div><div class="section-title">Albums</div><div class="grid">${artist.albums.map(album=>`<button type="button" class="album-card" data-detail-album="${album.index}"><div class="cover-wrap"><img src="${album.cover}" alt=""></div><h3>${escapeHtml(album.title)}</h3><p>${album.year} · ${album.tracks.length} tracks</p></button>`).join('')}</div></div>`,'artist')}
function showGenre(index){const genre=getGenres()[index];if(!genre)return;showDetail(`<div class="detail-scroll"><div class="artist-head"><img class="artist-photo" src="${genre.cover}" alt=""><div class="artist-name">${escapeHtml(genre.name)}</div><div class="artist-stats">${genre.albums.length} album${genre.albums.length===1?'':'s'} · ${genre.tracks} tracks</div><div class="artist-bio">Albums tagged ${escapeHtml(genre.name)} in your local collection.</div></div><div class="section-title">Albums</div><div class="grid">${genre.albums.map(album=>`<button type="button" class="album-card" data-detail-album="${album.index}"><div class="cover-wrap"><img src="${album.cover}" alt=""></div><h3>${escapeHtml(album.title)}</h3><p>${escapeHtml(album.artist)} · ${album.year}</p></button>`).join('')}</div></div>`,'genre')}
function saveTabs(){try{localStorage.setItem('visibleLibraryTabs',JSON.stringify(visibleViews))}catch{}}
function showSettings(preserveReturn=false,message=''){if(!preserveReturn)settingsReturnView=currentView;const settingsOrder=[...visibleViews,...TAB_ORDER.filter(view=>!visibleViews.includes(view))];const importLabel=importSummary||'Select audio files from this device';showDetail(`<div class="detail-scroll settings-page"><h1 class="settings-title">Settings</h1><div class="settings-section-title">Library Tabs</div><div class="settings-group" id="tabSettingsGroup">${settingsOrder.map(view=>{const enabled=visibleViews.includes(view);return`<div class="settings-row" data-tab-row="${view}" data-enabled="${enabled}">${enabled?`<span class="settings-drag" data-drag-tab="${view}" role="button" aria-label="Drag ${TAB_LABELS[view]} to reorder">≡</span>`:'<span class="settings-drag" aria-hidden="true"></span>'}<span class="settings-row-name">${TAB_LABELS[view]}${view==='settings'?'<span class="settings-row-sub">Always available by swiping past the last tab.</span>':''}</span><input class="settings-switch" type="checkbox" data-tab-toggle="${view}" aria-label="Show ${TAB_LABELS[view]}"${enabled?' checked':''}${visibleViews.length===1&&enabled?' disabled':''}${visibleViews.length===6&&!enabled?' disabled':''}></div>`}).join('')}</div><div class="settings-note" id="settingsNote" aria-live="polite">${message||`${visibleViews.length} of 6 tab slots used`}</div><div class="settings-section-title">Music</div><div class="settings-group"><div class="settings-row"><span class="settings-row-name"><span style="display:block">Import Music</span><span class="settings-value" id="importValue">${escapeHtml(importLabel)}</span></span><button type="button" class="settings-button" data-import-music>Import</button><input id="musicImport" type="file" accept="audio/*,.flac,.mp3,.m4a,.aac,.wav,.ogg,.opus" multiple hidden></div></div><div class="settings-section-title">Scrobbling</div><div class="settings-group">${lastFmUser?`<div class="settings-row"><span class="settings-row-name"><span style="display:block">Last.fm</span><span class="settings-value">Signed in as ${escapeHtml(lastFmUser)}</span></span><button type="button" class="settings-button" data-lastfm-disconnect>Sign Out</button></div>`:`<div class="settings-row"><input class="settings-text" id="lastFmUsername" autocomplete="username" placeholder="Last.fm username" aria-label="Last.fm username"><button type="button" class="settings-button" data-lastfm-connect>Sign In</button></div>`}</div></div>`,'settings');document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.view==='settings'))}
function updateTabChoice(view,enabled,input){if(enabled&&visibleViews.length>=6){input.checked=false;document.getElementById('settingsNote').textContent='All six tab slots are already used.';return}const next=enabled?[...visibleViews,view]:visibleViews.filter(item=>item!==view);if(!next.length){input.checked=true;document.getElementById('settingsNote').textContent='At least one tab must remain visible.';return}visibleViews=next;saveTabs();applyTabSettings();showSettings(true,`${visibleViews.length} of 6 tab slots used`)}
let tabDrag=null;
function beginTabDrag(handle,y){const view=handle.dataset.dragTab,row=handle.closest('[data-tab-row]');if(!view||!row)return;tabDrag={view,row,startY:y};row.classList.add('dragging')}
function updateTabDrag(y){if(!tabDrag)return;tabDrag.row.style.transform=`translateY(${y-tabDrag.startY}px)`}
function finishTabDrag(y){if(!tabDrag)return;const {view,row}=tabDrag,group=document.getElementById('tabSettingsGroup'),from=visibleViews.indexOf(view),rowHeight=row.getBoundingClientRect().height,top=group.getBoundingClientRect().top;row.classList.remove('dragging');row.style.transform='';tabDrag=null;if(from<0)return;const to=Math.max(0,Math.min(visibleViews.length-1,Math.floor((y-top)/rowHeight)));if(to===from)return;visibleViews.splice(from,1);visibleViews.splice(to,0,view);saveTabs();applyTabSettings();showSettings(true,`${TAB_LABELS[view]} moved to position ${to+1}.`)}
function importMusic(){document.getElementById('musicImport')?.click()}
function connectLastFm(){const input=document.getElementById('lastFmUsername'),username=input?.value.trim();if(!username){input?.focus();return}lastFmUser=username;try{localStorage.setItem('lastFmUser',lastFmUser)}catch{}showSettings(true,`Signed in to Last.fm as ${lastFmUser}.`)}
function disconnectLastFm(){lastFmUser='';try{localStorage.removeItem('lastFmUser')}catch{}showSettings(true,'Signed out of Last.fm.')}
function showQueue(){const upcoming=queue.slice(queueIndex+1);showDetail(`<div class="detail-scroll queue-page"><div class="queue-heading"><h2>Now Playing</h2><div class="queue-tools"><button type="button" class="queue-tool" data-shuffle-queue title="Shuffle">⇄</button><button type="button" class="queue-tool" title="Repeat">↻</button></div></div>${currentTrack?`<div class="queue-now"><img src="${currentTrack.cover}" alt=""><div><div class="queue-name">${escapeHtml(currentTrack.title)}</div><div class="queue-meta">${escapeHtml(currentTrack.artist)} · ${escapeHtml(currentTrack.album)}</div></div><span class="playing-mark">▥</span></div>`:'<div class="queue-empty">Nothing is playing.</div>'}<div class="queue-up-head"><h2>Up Next</h2><button type="button" class="clear-queue" data-clear-queue>Clear Queue</button></div><div>${upcoming.length?upcoming.map((track,offset)=>`<button type="button" class="queue-item" data-queue-position="${queueIndex+1+offset}"><img src="${track.cover}" alt=""><span><span class="queue-name">${escapeHtml(track.title)}</span><span class="queue-meta">${escapeHtml(track.artist)} · ${escapeHtml(track.album)}</span></span></button>`).join(''):'<div class="queue-empty">Your queue is empty.</div>'}</div></div><div class="queue-footer"><span>${queue.length} track${queue.length===1?'':'s'}</span></div>`,'queue')}
function showTrack(track){currentTrack=track;hero.src=track.cover;document.getElementById('miniCover').src=track.cover;document.getElementById('miniTitle').textContent=track.title;document.getElementById('miniArtist').textContent=track.artist;document.getElementById('playerTitle').textContent=track.title;document.getElementById('playerMeta').textContent=`${track.artist} — ${track.album}`;document.getElementById('playerQuality').textContent=`FLAC ${track.quality}`;document.getElementById('miniProgress').style.transform='scaleX(0)';updateQueueLabel()}
function startTrack(track){if(!track)return;showTrack(track);if(audio.src!==new URL(track.audio,location.href).href)audio.src=track.audio;audio.play().catch(()=>{});openPlayer(false)}
function playQueue(tracks,index=0){queue=[...tracks];queueIndex=index;startTrack(queue[queueIndex])}
function playSelection(track){const album=library.albums.find(item=>item.title===track.album&&item.artist===track.artist);const tracks=album?.tracks||[track];playQueue(tracks,Math.max(0,tracks.indexOf(track)))}
function openPlayer(paused=false){hideAll();player.classList.remove('hidden');setPlayer(paused)}
function setPlayer(paused){hero.className='hero '+(paused?'paused':'playing');body.className='player-body '+(paused?'paused-body':'');const miniToggle=document.getElementById('miniToggle');miniToggle.textContent=paused?'▶':'Ⅱ';miniToggle.setAttribute('aria-label',paused?'Play':'Pause');if(paused)audio.pause();else if(currentTrack)audio.play().catch(()=>{})}
function togglePlayback(){if(!currentTrack)return;if(audio.paused){if(!audio.src)audio.src=currentTrack.audio;audio.play().catch(()=>{})}else audio.pause()}
function likeCurrentTrack(){if(!currentTrack)return;likedSongs.add(currentTrack.id);const burst=document.getElementById('likeBurst');burst.classList.remove('show');void burst.offsetWidth;burst.classList.add('show');burst.setAttribute('aria-label',`${currentTrack.title} liked`)}
function updateQueueLabel(){const remaining=Math.max(0,queue.length-queueIndex-1);document.getElementById('queueLabel').textContent=remaining?`${remaining} track${remaining===1?'':'s'} up next`:'Queue is empty'}
function formatTime(seconds){if(!Number.isFinite(seconds)||seconds<0)return'0:00';const minutes=Math.floor(seconds/60),rest=Math.floor(seconds%60);return`${minutes}:${String(rest).padStart(2,'0')}`}
function updateProgress(){document.getElementById('elapsedTime').textContent=formatTime(audio.currentTime);document.getElementById('durationTime').textContent=formatTime(audio.duration);const ratio=audio.duration?Math.max(0,Math.min(1,audio.currentTime/audio.duration)):0;document.getElementById('miniProgress').style.transform=`scaleX(${ratio})`;document.getElementById('mini').setAttribute('aria-label',`${currentTrack?.title||'Track'} ${Math.round(ratio*100)} percent played`);wave.querySelectorAll('.bar').forEach((bar,index)=>bar.classList.toggle('played',index/WAVE_BAR_COUNT<=ratio))}
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
content.addEventListener('click',event=>{const track=event.target.closest('[data-track]'),album=event.target.closest('[data-album]'),artist=event.target.closest('[data-artist]'),genre=event.target.closest('[data-genre]');if(track)playSelection(library.tracks[Number(track.dataset.track)]);else if(album)showAlbum(Number(album.dataset.album));else if(artist)showArtist(Number(artist.dataset.artist));else if(genre)showGenre(Number(genre.dataset.genre))});
function handleLibrarySearch(event){if(event.target.id!=='librarySearch')return;searchState[currentView]=event.target.value;updateResults()}
content.addEventListener('input',handleLibrarySearch);
content.addEventListener('search',handleLibrarySearch);
content.addEventListener('change',event=>{if(event.target.id!=='libraryFilter')return;filterState[currentView]=event.target.value;updateResults()});
detailContent.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.hasAttribute('data-import-music'))importMusic();else if(target.hasAttribute('data-lastfm-connect'))connectLastFm();else if(target.hasAttribute('data-lastfm-disconnect'))disconnectLastFm();else if(target.dataset.detailAlbum!==undefined)showAlbum(Number(target.dataset.detailAlbum));else if(target.dataset.openArtist!==undefined)showArtist(Number(target.dataset.openArtist));else if(target.dataset.playAlbum!==undefined)playQueue(library.albums[Number(target.dataset.playAlbum)].tracks,0);else if(target.dataset.shuffleAlbum!==undefined)playQueue(shuffled(library.albums[Number(target.dataset.shuffleAlbum)].tracks),0);else if(target.dataset.detailTrack!==undefined)playSelection(library.tracks[Number(target.dataset.detailTrack)]);else if(target.dataset.queuePosition!==undefined){queueIndex=Number(target.dataset.queuePosition);startTrack(queue[queueIndex])}else if(target.hasAttribute('data-clear-queue')){queue=currentTrack?[currentTrack]:[];queueIndex=currentTrack?0:-1;updateQueueLabel();showQueue()}else if(target.hasAttribute('data-shuffle-queue')){const next=shuffled(queue.slice(queueIndex+1));queue=queue.slice(0,queueIndex+1).concat(next);showQueue()}});
detailContent.addEventListener('change',event=>{if(event.target.matches('[data-tab-toggle]'))updateTabChoice(event.target.dataset.tabToggle,event.target.checked,event.target);else if(event.target.id==='musicImport'&&event.target.files?.length){const count=event.target.files.length;importSummary=`${count} audio file${count===1?'':'s'} selected`;showSettings(true,`${importSummary} for import.`)}});
detailContent.addEventListener('touchstart',event=>{const handle=event.target.closest('[data-drag-tab]');if(!handle)return;event.preventDefault();beginTabDrag(handle,event.changedTouches[0].clientY)},{passive:false});
detailContent.addEventListener('touchmove',event=>{if(!tabDrag)return;event.preventDefault();updateTabDrag(event.changedTouches[0].clientY)},{passive:false});
detailContent.addEventListener('touchend',event=>{if(tabDrag)finishTabDrag(event.changedTouches[0].clientY)},{passive:true});
detailContent.addEventListener('mousedown',event=>{const handle=event.target.closest('[data-drag-tab]');if(handle)beginTabDrag(handle,event.clientY)});
detailContent.addEventListener('mousemove',event=>updateTabDrag(event.clientY));
detailContent.addEventListener('mouseup',event=>finishTabDrag(event.clientY));
function openTab(view){if(view==='settings')showSettings();else{showLibrary();render(view);content.scrollTop=0}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openTab(b.dataset.view));
document.getElementById('miniOpen').onclick=()=>{if(currentTrack)openPlayer(audio.paused)};document.getElementById('miniToggle').onclick=togglePlayback;document.getElementById('queueBtn').onclick=showQueue;audio.onplay=()=>setPlayer(false);audio.onpause=()=>setPlayer(true);audio.ontimeupdate=updateProgress;audio.onloadedmetadata=updateProgress;audio.onended=()=>{if(queueIndex+1<queue.length){queueIndex++;startTrack(queue[queueIndex])}else setPlayer(true)};
function addSwipeControl(element,onSwipe){let startX=0,startY=0,startTime=0;const begin=(x,y)=>{startX=x;startY=y;startTime=Date.now()};const finish=(x,y)=>{const dx=x-startX,dy=y-startY,elapsed=Date.now()-startTime;if(elapsed>900||Math.max(Math.abs(dx),Math.abs(dy))<64)return;lastSwipeAt=Date.now();if(Math.abs(dx)>Math.abs(dy)*1.2)onSwipe(dx>0?'right':'left');else if(Math.abs(dy)>Math.abs(dx)*1.2)onSwipe(dy>0?'down':'up')};element.addEventListener('touchstart',event=>{const touch=event.changedTouches[0];begin(touch.clientX,touch.clientY)},{passive:true});element.addEventListener('touchend',event=>{const touch=event.changedTouches[0];finish(touch.clientX,touch.clientY)},{passive:true});element.addEventListener('mousedown',event=>begin(event.clientX,event.clientY));element.addEventListener('mouseup',event=>finish(event.clientX,event.clientY))}
function hideLibraryTools(){content.classList.remove('tools-visible')}
function showLibraryTools(){content.classList.add('tools-visible')}
addSwipeControl(content,direction=>{const index=visibleViews.indexOf(currentView);if(direction==='down'){showLibraryTools()}else if(direction==='up'&&content.classList.contains('tools-visible')){hideLibraryTools()}else if(direction==='left'&&index<visibleViews.length-1){openTab(visibleViews[index+1])}else if(direction==='left'&&index===visibleViews.length-1){showSettings()}else if(direction==='right'&&index>0){openTab(visibleViews[index-1])}});
content.addEventListener('scroll',()=>{if(content.scrollTop>3)hideLibraryTools()},{passive:true});
content.addEventListener('wheel',event=>{if(event.deltaY<0&&content.scrollTop<=2)showLibraryTools()},{passive:true});
addSwipeControl(player,direction=>{if(direction==='right')showLibrary();else if(direction==='up')showQueue()});
addSwipeControl(detailPage,direction=>{const scroller=detailContent.querySelector('.detail-scroll');if(detailMode==='queue'&&(direction==='right'||(direction==='down'&&(!scroller||scroller.scrollTop<4))))openPlayer(audio.paused);else if(detailMode==='settings'){const index=visibleViews.indexOf('settings');if(direction==='right'){const target=index>0?visibleViews[index-1]:(visibleViews.includes(settingsReturnView)?settingsReturnView:visibleViews.find(view=>view!=='settings'));if(target)openTab(target)}else if(direction==='left'&&index>=0&&index<visibleViews.length-1)openTab(visibleViews[index+1])}else if(direction==='right')showLibrary()});
player.addEventListener('click',event=>{if(event.target.closest('button,.wave')||Date.now()-lastSwipeAt<350)return;const now=Date.now();if(now-lastPlayerTap<300){clearTimeout(tapTimer);lastPlayerTap=0;likeCurrentTrack()}else{lastPlayerTap=now;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{lastPlayerTap=0;togglePlayback()},300)}});
let seed=17;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
const WAVE_BAR_COUNT=84,wave=document.getElementById('wave');for(let i=0;i<WAVE_BAR_COUNT;i++){const b=document.createElement('i');b.className='bar';let h=6+Math.pow(rnd(),2.7)*76;if(i===27||i===55||i===82)h=84;b.style.height=h+'px';wave.appendChild(b)}
wave.onclick=event=>{if(!audio.duration)return;const rect=wave.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width))*audio.duration};
const q=new URLSearchParams(location.search),view=q.get('view')||'albums';applyTabSettings();content.innerHTML='<div class="empty">Loading library…</div>';fetch('/api/library').then(response=>{if(!response.ok)throw new Error('Could not read library');return response.json()}).then(data=>{library=data;if(library.tracks[0]){queue=[library.tracks[0]];queueIndex=0;showTrack(library.tracks[0])}openTab(visibleViews.includes(view)?view:visibleViews[0])}).catch(error=>{content.innerHTML=`<div class="empty">${escapeHtml(error.message)}<br>Run this app with <code>npm run dev</code>.</div>`});
</script>
