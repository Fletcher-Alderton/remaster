name: Music
options:
  bundleIdPrefix: com.fletcher
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "12.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: "L5C6Z6SQ2H"
targets:
  Music:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fletcher.MusicPrototype
        CODE_SIGN_ENTITLEMENTS: Music.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - path: Sources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: ../../QOBINE_GPL-3.0.txt
        buildPhase: resources

      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Resources/EQ
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Music
        CFBundleName: Music
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.fletcher.MusicPrototype.qobuz-oauth
            CFBundleURLSchemes:
              - qobuz-music
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        UIBackgroundModes:
          - audio
  MusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures/**
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fletcher.MusicPrototypeTests
        GENERATE_INFOPLIST_FILE: YES
  MusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fletcher.MusicPrototypeUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Music:
    build:
      targets:
        Music: all
        MusicTests: [test]
        MusicUITests: [test]
    test:
      targets:
        - MusicTests
        - MusicUITests
